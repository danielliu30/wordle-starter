# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = app/database/migrations

# template used to generate migration file names
file_template = %%(year)d_%(month).2d_%(day).2d_%(hour).2d_%(minute).2d_%%(rev)s_%(slug)s

# sys.path path, will be prepended to sys.path if present
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# timezone =

# max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during the 'revision' command
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without a source .py file to be detected as revisions
# sourceless = false

# version location specification
# version_locations = %(here)s/bar:%(here)s/bat:alembic/versions

# version path separator
version_path_separator = os

# set to 'true' to search source files recursively
# recursive_version_locations = false

# the output encoding used when revision files are written from script.py.mako
# output_encoding = utf-8

sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts
# black = yes

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[loggers.root]
level = WARN
handlers = console
qualkey =

[loggers.sqlalchemy]
level = WARN
handlers =
qualkey =

[loggers.alembic]
level = INFO
handlers =
qualkey =

[handlers]
console = class=StreamHandler
level = NOTSET
formatter = generic

[formatters]
generic = %(levelname)-5.5s [%(name)s] %(message)s
