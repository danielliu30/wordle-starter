services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=wordle
      - POSTGRES_USER=${POSTGRES_USER:-wordle}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-wordle}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d wordle"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      # Set DATABASE_URL directly when the password has URL-reserved characters (percent-encode them).
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-wordle}:${POSTGRES_PASSWORD:-wordle}@db:5432/wordle}
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
